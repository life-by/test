                for (const sheetKey in SPRITE_SHEETS_CONFIG) {
                    const cfg = SPRITE_SHEETS_CONFIG[sheetKey];
                    const isLoaded = SpriteManager.loadedSheets.has(sheetKey);

                    let previewItemsHtml = '';
                    for (const itemId of cfg.items) {
                        const url = cfg.isResource ? SpriteManager.resourceUrls[itemId] : SpriteManager.buildingUrls[itemId];
                        if (!url) continue;
                        let label = cfg.isResource ? (RESOURCE_META[itemId]?.name || itemId) : (cfg.isCastle ? itemId.replace('castle_', 'Lv.') : (BUILDINGS[itemId]?.name || itemId));
                        previewItemsHtml += `<div class="sprite-preview-item"><img src="${url}" alt="${label}"><span title="${label}">${label}</span></div>`;
                    }

                    let castleLvlButtons = '';
                    if (cfg.isCastle) {
                        castleLvlButtons = `<div style="margin-top:8px; font-size:11px; color:#f1c40f;">অথবা আলাদা <b>.txt (Base64)</b> / ছবি দিয়ে প্রতিটি লেভেল লোড করুন:</div><div class="castle-lvl-grid">`;
                        for (let l = 1; l <= 10; l++) {
                            const hasLvl = !!SpriteManager.buildingCanvases[`castle_${l}`];
                            castleLvlButtons += `
                                <label class="lvl-btn ${hasLvl ? 'done' : ''}">
                                    ${hasLvl ? '✓' : '+'} Lv.${l}
                                    <input type="file" accept=".txt,text/plain,image/*" style="display:none;" onchange="SpriteManager.handleSingleCastleUpload(${l}, this.files[0])">
                                </label>
                            `;
                        }
                        castleLvlButtons += `</div>`;
                    }

                    html += `
                        <div class="stat-box">
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                                <div>
                                    <h4>${cfg.title}</h4>
                                    <small style="color:var(--text-muted);">ফোল্ডার নাম: <code>${cfg.filename}</code> • গ্রিড: ${cfg.cols}×${cfg.rows}</small>
                                </div>
                                <div style="display:flex; gap:6px; align-items:center;">
                                    <span class="badge" style="background:${isLoaded ? '#2ecc71' : '#7f8c8d'}; color:${isLoaded ? '#000' : '#fff'};">
                                        ${isLoaded ? '✓ লোড হয়েছে' : 'লোড হয়নি'}
                                    </span>
                                    <label class="btn-action gold" style="cursor:pointer;">
                                        📂 পুরো শিট ইমেজ বাছুন
                                        <input type="file" accept="image/*" style="display:none;" onchange="SpriteManager.handleFileUpload('${sheetKey}', this.files[0])">
                                    </label>
                                    ${isLoaded ? `<button class="btn-action red" onclick="SpriteManager.deleteSheet('${sheetKey}')">✕</button>` : ''}
                                </div>
                            </div>
                            ${castleLvlButtons}
                            ${previewItemsHtml ? `<div class="sprite-preview-strip">${previewItemsHtml}</div>` : ''}
                        </div>
                    `;
                }
                bodyEl.innerHTML = html;
            } else if (type === 'citizens') {
                titleEl.innerText = '👨‍👩‍👧‍👦 নাগরিক ও জনসংখ্যা ব্যবস্থাপনা';
                let jobsHtml = '';
                for (let k in PROFESSIONS) jobsHtml += `<div class="stat-row"><span>${PROFESSIONS[k].icon} ${PROFESSIONS[k].name}</span><b>${PopulationManager.jobs[k] || 0} জন</b></div>`;
                bodyEl.innerHTML = `
                    <div class="grid-2">
                        <div class="stat-box">
                            <h4>জনসংখ্যা পরিসংখ্যান</h4>
                            <div class="stat-row"><span>মোট নাগরিক</span><b>${PopulationManager.total} জন</b></div>
                            <div class="stat-row"><span>আবাসন ধারণক্ষমতা</span><b>${PopulationManager.capacity} জন</b></div>
                            <div class="stat-row"><span>কর্মরত নাগরিক</span><b>${PopulationManager.employed} জন</b></div>
                            <div class="stat-row"><span>বেকার / অতিরিক্ত</span><b>${PopulationManager.unemployed} জন</b></div>
                            <div class="stat-row"><span>শ্রমিক প্রাপ্যতা হার</span><b>${Math.round(EconomyManager.workerEfficiency * 100)}%</b></div>
                        </div>
                        <div class="stat-box">
                            <h4>জীবনযাত্রার মান</h4>
                            <div class="stat-row"><span>😊 নাগরিক সুখ</span><b>${PopulationManager.happiness}%</b></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${PopulationManager.happiness}%"></div></div>
                            <div class="stat-row" style="margin-top:6px;"><span>🏥 গড় স্বাস্থ্য</span><b>${PopulationManager.health}%</b></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${PopulationManager.health}%;background:#3498db;"></div></div>
                            <div class="stat-row" style="margin-top:6px;"><span>🎓 শিক্ষার হার</span><b>${PopulationManager.education}%</b></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${PopulationManager.education}%;background:#9b59b6;"></div></div>
                            <div class="stat-row" style="margin-top:6px;"><span>🛡️ নিরাপত্তা</span><b>${PopulationManager.security}%</b></div>
                        </div>
                    </div>
                    <div class="stat-box"><h4>পেশাভিত্তিক কর্মসংস্থান তালিকা</h4>${jobsHtml}</div>
                `;
            } else if (type === 'economy') {
                titleEl.innerText = '📊 রাজ্যের অর্থনীতি ও সম্পদ প্রতিবেদন';
                let rows = '';
                for (let k in RESOURCE_META) {
                    const m = RESOURCE_META[k], r = ResourceManager.data[k];
                    rows += `
                        <div class="stat-row">
                            <span>${this.getResIconHTML(k, 16)} <b>${m.name}</b></span>
                            <span>মজুদ: <b>${Math.floor(r.amount)}</b> / ${m.isCurrency ? 'সীমাহীন' : r.capacity}</span>
                            <span style="color:#2ecc71;">+${r.prod}/

s</span>
                            <span style="color:#e74c3c;">-${r.cons}/s</span>
                            <span>নিট: <b>${(r.net >= 0 ? '+' : '') + r.net}/s</b></span>
                        </div>
                    `;
                }
                bodyEl.innerHTML = `
                    <div class="stat-box">
                        <h4>সকল সম্পদের উৎপাদন, ব্যবহার ও মজুদ</h4>
                        ${rows}
                    </div>
                    <div class="grid-2">
                        <div class="stat-box">
                            <h4>উৎপাদন শৃঙ্খল (Production Chains)</h4>
                            <div class="stat-row"><span>🌾 গম/ধান খামার ➔ আটাকল ➔ বেকারি</span></div>
                            <div class="stat-row"><span>🪨 পাথর খাদান + 🪵 কাঠ ➔ ইটভাটা (🧱 ইট)</span></div>
                            <div class="stat-row"><span>⛓️ লোহা + 🪵 কাঠ + ⚡ বিদ্যুৎ ➔ ভারী কারখানা</span></div>
                            <div class="stat-row"><span>🧶 কাপড় + 🌾 খাদ্য ➔ বিপণিবিতান ও বাজার (🪙 গোল্ড)</span></div>
                        </div>
                        <div class="stat-box">
                            <h4>পরিবেশ ও আবহাওয়া প্রভাব</h4>
                            <div class="stat-row"><span>বর্তমান ঋতু</span><b>${EnvironmentManager.getCurrentSeason().name}</b></div>
                            <div class="stat-row"><span>আবহাওয়া</span><b>${EnvironmentManager.getCurrentWeather().name}</b></div>
                            <div class="stat-row"><span>শিল্প দূষণ মাত্রা</span><b>${EnvironmentManager.pollution}</b></div>
                            <div class="stat-row"><span>পরিবেশের মান</span><b>${EnvironmentManager.quality}%</b></div>
                        </div>
                    </div>
                `;
            } else if (type === 'market') {
                titleEl.innerText = '⚖️ কেন্দ্রীয় বাজার ও বাণিজ্য কেন্দ্র';
                let tradeRows = '';
                for (let k in RESOURCE_META) {
                    if (RESOURCE_META[k].isCurrency || RESOURCE_META[k].isUtility) continue;
                    const m = RESOURCE_META[k], r = ResourceManager.data[k];
                    const buyPrice = Math.ceil(r.price * 1.25) * 10;
                    const sellPrice = Math.max(1, Math.floor(r.price * 0.85)) * 10;
                    tradeRows += `
                        <div class="stat-row">
                            <span>${this.getResIconHTML(k, 16)} <b>${m.name}</b> (মজুদ: ${Math.floor(r.amount)})</span>
                            <div style="display:flex; gap:6px;">
                                <button class="btn-action green" onclick="MarketManager.buy('${k}', 10)">+১০ কিনুন (🪙${buyPrice})</button>
                                <button class="btn-action gold" onclick="MarketManager.sell('${k}', 10)">-১০ বেচুন (+🪙${sellPrice})</button>
                            </div>
                        </div>
                    `;
                }
                bodyEl.innerHTML = `
                    <div class="stat-box">
                        <h4>বর্তমান রাজকোষ: ${this.getResIconHTML('gold', 18)} ${Math.floor(ResourceManager.data.gold.amount)} গোল্ড</h4>
                        <p style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">
                            চাহিদা ও মজুদের ওপর ভিত্তি করে বাজারের দাম ওঠানামা করে।
                        </p>
                        ${tradeRows}
                    </div>
                `;
            } else if (type === 'research') {
                titleEl.innerText = '🔬 প্রযুক্তি ও গবেষণা বৃক্ষ';
                let techHtml = '';
                for (let t of TECH_TREE) {
                    const isDone = ResearchManager.unlocked.has(t.id);
                    techHtml += `
                        <div class="stat-box" style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <h4>[${t.cat}] ${t.name}</h4>
                                <p style="font-size:11px; color:var(--text-muted);">${t.desc}</p>
                            </div>
                            ${isDone
                                ? `<span class="badge" style="background:#2ecc71;color:#000;">✓ সম্পন্ন</span>`
                                : `<button class="btn-action gold" onclick="ResearchManager.unlock('${t.id}')">গবেষণা (🪙${t.cost})</button>`
                            }
                        </div>
                    `;
                }
                bodyEl.innerHTML = techHtml;
            } else if (type === 'missions') {
                titleEl.innerText = '🏆 রাজ্যের মিশন ও অর্জনসমূহ';
                let mHtml = '';
                for (let m of MISSIONS) {
                    const done = MissionManager.completed.has(m.id), claimed = MissionManager.claimed.has(m.id);
                    const rewStr = Object.entries(m.reward).map(([rk, rv]) => `${this.getResIconHTML(rk, 14)}${rv}`).join(' ');
                    mHtml += `
                        <div class="stat-box" style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <h4>${m.title}</h4>
                                <p style="font-size:11px; color:var(--text-muted);">${m.desc}</p>
                                <small style="color:#f1c40f;">পুরস্কার: ${rewStr}</small>
                            </div>
                            <div>
                                ${claimed
                                    ? `<span class="badge">সংগৃহীত ✓</span>`
                                    : (done
                                        ? `<button class="btn-action green" onclick="MissionManager.claim('${m.id}')">🎁 পুরস্কার নিন</button>`
                                        : `<span class="badge" style="opacity:0.6;">চলমান...</span>`)
                                }
                            </div>
                        </div>
                    `;
                }
                bodyEl.innerHTML = mHtml;
            } else if (type === 'building_info') {
                const b = BuildingManager.map[BuildingManager.selectedKey];
                if (!b) { this.closeModal(); return; }
                const spec = BUILDINGS[b.type];
                titleEl.innerText = `🏛️ ${spec.name} (লেভেল ${b.level})`;
                const thumbUrl = SpriteManager.getBuildingThumbUrl(b.type, b.level);
                const roadOk = !spec.roadReq || BuildingManager.hasAdjacentRoad(b.x, b.y);
                bodyEl.innerHTML = `
                    <div class="stat-box">
                        ${thumbUrl ? `<div style="text-align:center;margin-bottom:8px;"><img src="${thumbUrl}" style="max-height:110px;object-fit:contain;"></div>` : ''}
                        <p style="margin-bottom:8px;">${spec.desc}</p>
                        <div class="stat-row"><span>অবস্থান (স্থানাঙ্ক)</span><b>(${b.x}, ${b.y})</b></div>
                        <div class="stat-row"><span>বর্তমান কার্যক্ষমতা</span><b>${Math.round((b.efficiency || 1) * 100)}%</b></div>
                        <div class="stat-row"><span>প্রয়োজনীয় কর্মী</span><b>${spec.workers || 0} জন</b></div>
                        <div class="stat-row"><span>রাস্তা সংযোগ</span><b>${roadOk ? '✓ সংযুক্ত' : '⚠️ রাস্তা সংযোগ নেই (-৪৫% উৎপাদন)'}</b></div>
                        <div class="stat-row"><span>রক্ষণাবেক্ষণ খরচ</span><b>🪙 ${spec.maint || 0}/s</b></div>
                    </div>
                `;
            } else if (type === 'settings') {
                titleEl.innerText = '⚙️ গেম সেটিংস, পারফরম্যান্স ও সেভ ম্যানেজার';
                bodyEl.innerHTML = `
                    <div class="grid-2">
                        <div class="stat-box">
                            <h4>গ্রাফিক্স ও পারফরম্যান্স (FPS: ${PerformanceManager.fps})</h4>
                            <p style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">লো-এন্ড ফোনের জন্য Low মোড ব্যবহার করুন।</p>
                            <div style="display:flex; gap:6px;">
                                <button class="btn-action ${PerformanceManager.quality==='low'?'green':''}" onclick="PerformanceManager.setQuality('low'); UIManager.renderModalContent('settings');">Low</button>
                                <button class="btn-action ${PerformanceManager.quality==='medium'?'green':''}" onclick="PerformanceManager.setQuality('medium'); UIManager.renderModalContent('settings');">Medium</button>
                                <button class="btn-action ${PerformanceManager.quality==='high'?'green':''}" onclick="PerformanceManager.setQuality('high'); UIManager.renderModalContent('settings');">High</button>
                            </div>
                        </div>
                        <div class="stat-box">
                            <h4>রাজ্যের সীমানা প্রসারণ</h4>
                            <div class="stat-row"><span>বর্তমান ব্যাসার্ধ</span><b>${WorldManager.unlockedRadius} টাইলস</b></div>
                            <button class="btn-action gold" style="margin-top:8px;" onclick="WorldManager.promptExpandLand(); UIManager.renderModalContent('settings');">
                                🗺️ সীমানা বাড়ান (🪙 ${WorldManager.getExpandCost()})
                            </button>
                        </div>
                    </div>
                    <div class="stat-box">
                        <h4>🖼️ স্প্রাইট ও ইমেজ কাস্টমাইজেশন</h4>
                        <p style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">আপনার প্রাসাদ, ভবন ও রিসোর্স আইকনের ইমেজ শিট বা Base64 লোড করুন।</p>
                        <button class="btn-action green" onclick="UIManager.openModal('sprites')">🖼️ ইমেজ ও স্প্রাইট ম্যানেজার খুলুন (${SpriteManager.loadedSheets.size}/9 লোড হয়েছে)</button>
                    </div>
                    <div class="stat-box">
                        <h4>💾 সেভ এবং লোড সিস্টেম (IndexedDB)</h4>
                        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
                            <button class="btn-action green" onclick="SaveManager.saveGame('autosave')">💾 ম্যানুয়াল সেভ করুন</button>
                            <button class="btn-action" onclick="SaveManager.loadGame('autosave').then(()=>UIManager.closeModal())">🔄 শেষ সেভ লোড করুন</button>
                            <button class="btn-action gold" onclick="SaveManager.exportJSON()">⬇️ সেভ ফাইল এক্সপোর্ট</button>
                            <label class="btn-action" style="display:inline-block;">
                                ⬆️ সেভ ইমপোর্ট <input type="file" accept=".json" style="display:none;" onchange="SaveManager.importJSON(this.files[0])">
                            </label>
                            <button class="btn-action red" onclick="SaveManager.resetGame()">🗑️ গেম রিসেট করুন</button>
                        </div>
                    </div>
                `;
            }
        },

        showToast(msg, bgColor = 'rgba(231, 76, 60, 0.95)') {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.background = bgColor;
            t.style.display = 'block';
            clearTimeout(this.toastTimer);
            this.toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
        }
    };

    // --- 15. MAIN GAME ENGINE ---
    const GameEngine = {
        speed: 1,
        lastTickTime: performance.now(),
        autoSaveCounter: 0,

        async init() {
            PerformanceManager.init();
            WorldManager.initNewWorld();
            ResourceManager.init();
            PopulationManager.init();
            BuildingManager.init();
            MapRenderer.init();

            await SpriteManager.init();
            await SaveManager.init();

            const loaded = await SaveManager.loadGame('autosave');
            if (loaded) {
                UIManager.showToast('স্বাগতম! আপনার পূর্বের রাজ্য লোড করা হয়েছে।', '#2ecc71');
            } else {
                EconomyManager.recalculate();
                UIManager.showToast('আমার রাজ্যে স্বাগতম! নিচের নির্মাণ মেনু ও 🖼️ বাটন থেকে ইমেজ লোড করুন।', '#3498db');
            }

            CameraController.init(MapRenderer.canvas);
            UIManager.init();
            MissionManager.checkAll();

            requestAnimationFrame((now) => this.loop(now));
        },

        setSpeed(spd) {
            this.speed = spd;
            for (let s of [0, 1, 2, 3]) {
                const btn = document.getElementById(`spd-${s}`);
                if (btn) btn.classList.toggle('active', s === spd);
            }
        },

        loop(now) {
            PerformanceManager.update(now);

            if (this.speed > 0 && !PerformanceManager.isTabHidden) {
                const interval = 1000 / this.speed;
                if (now - this.lastTickTime >= interval) {
                    this.lastTickTime = now;
                    EconomyManager.stepTick();

                    this.autoSaveCounter++;
                    if (this.autoSaveCounter >= 15) {
                        this.autoSaveCounter = 0;
                        SaveManager.saveGame('autosave', true);
                    }
                }
            }

            MapRenderer.render(now);
            requestAnimationFrame((n) => this.loop(n));
        }
    };

    window.addEventListener('DOMContentLoaded', () => {
        GameEngine.init();
    });
    </script>
</body>
</html>
