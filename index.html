            reader.readAsDataURL(file);
        },

        handleSingleCastleUpload(level, file) {
            if (!file) return;
            if (file.name.toLowerCase().endsWith('.txt') || file.type === 'text/plain') {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const text = (e.target.result || '').trim();
                    if (!text.startsWith('data:image/')) {
                        UIManager.showToast('ফাইলের ভেতরে সঠিক Base64 ইমেজ কোড পাওয়া যায়নি!', '#e74c3c');
                        return;
                    }
                    await this.loadSingleCastleDataUrl(level, text, true);
                    UIManager.renderModalContent('sprites');
                    UIManager.showToast(`🏰 মহল লেভেল ${level} সফলভাবে যুক্ত হয়েছে!`, '#2ecc71');
                };
                reader.readAsText(file);
            } else {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    await this.loadSingleCastleDataUrl(level, e.target.result, true);
                    UIManager.renderModalContent('sprites');
                    UIManager.showToast(`🏰 মহল লেভেল ${level} সফলভাবে যুক্ত হয়েছে!`, '#2ecc71');
                };
                reader.readAsDataURL(file);
            }
        },

        loadSingleCastleDataUrl(level, dataUrl, persist) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const cleaned = this.cleanSingleSprite(img, false);
                    const key = `castle_${level}`;
                    this.buildingCanvases[key] = cleaned;
                    let finalUrl = dataUrl;
                    try { finalUrl = cleaned.toDataURL('image/png'); } catch (e) {}
                    this.buildingUrls[key] = finalUrl;
                    EMBEDDED_SPRITES.castle[level] = finalUrl;
                    this.loadedSheets.add('castle');
                    if (persist) this.dbPut(`castle_lvl_${level}`, finalUrl);
                    resolve(true);
                };
                img.onerror = () => resolve(false);
                img.src = dataUrl;
            });
        },

        processSheetFromUrl(sheetKey, dataUrl, persist) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    this.sheetRawDataUrls[sheetKey] = dataUrl;
                    this.sliceAndStore(sheetKey, img);
                    if (persist) this.dbPut(sheetKey, dataUrl);
                    resolve(true);
                };
                img.onerror = () => resolve(false);
                img.src = dataUrl;
            });
        },

        sliceAndStore(sheetKey, img) {
            const cfg = SPRITE_SHEETS_CONFIG[sheetKey];
            if (!cfg) return;

            const cellW = img.naturalWidth / cfg.cols;
            const cellH = img.naturalHeight / cfg.rows;

            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

            cfg.items.forEach((itemId, idx) => {
                const col = idx % cfg.cols;
                const row = Math.floor(idx / cfg.cols);
                const sx = Math.floor(col * cellW);
                const sy = Math.floor(row * cellH);
                const sw = Math.floor(cellW);
                const sh = Math.floor(cellH);

                tempCanvas.width = sw;
                tempCanvas.height = sh;
                tCtx.clearRect(0, 0, sw, sh);
                tCtx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

                let cleaned = null;
                let url = null;
                try {
                    cleaned = this.cleanCellCanvas(tempCanvas, sw, sh, true);
                    if (cleaned) url = cleaned.toDataURL('image/png');
                } catch (secErr) {
                    // Fallback if file:// SecurityError taints canvas
                    const safeCopy = document.createElement('canvas');
                    safeCopy.width = sw;
                    safeCopy.height = Math.floor(sh * 0.82);
                    safeCopy.getContext('2d').drawImage(img, sx, sy, sw, safeCopy.height, 0, 0, sw, safeCopy.height);
                    cleaned = safeCopy;
                }

                if (cleaned) {
                    if (cfg.isResource) {
                        if (url) this.resourceUrls[itemId] = url;
                    } else {
                        this.buildingCanvases[itemId] = cleaned;
                        if (url) this.buildingUrls[itemId] = url;
                    }
                }
            });

            this.loadedSheets.add(sheetKey);
        },

        cleanSingleSprite(img, stripLabel) {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth;
            c.height = img.naturalHeight;
            c.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0);
            try {
                return this.cleanCellCanvas(c, c.width, c.height, stripLabel) || c;
            } catch (e) {
                return c;
            }
        },

        cleanCellCanvas(srcCanvas, w, h, stripBottomLabel) {
            const ctx = srcCanvas.getContext('2d', { willReadFrequently: true });
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const isWhiteBg = (p) => {
                const a = data[p + 3];
                if (a < 20) return true;
                const r = data[p], g = data[p + 1], b = data[p + 2];
                const max = r > g ? (r > b ? r : b) : (g > b ? g : b);
                const min = r < g ? (r < b ? r : b) : (g < b ? g : b);
                return r > 228 && g > 228 && b > 228 && (max - min) < 24;
            };

            if (stripBottomLabel) {
                const rowNonBg = new Uint16Array(h);
                for (let y = 0; y < h; y++) {
                    let count = 0;
                    const rowOff = y * w * 4;
                    for (let x = 0; x < w; x++) {
                        if (!isWhiteBg(rowOff + x * 4)) count++;
                    }
                    rowNonBg[y] = count;
                }

                let seenLabel = false, labelBottom = h - 1, gapCount = 0, cutY = -1;
                const minCheckY = Math.floor(h * 0.58);

                for (let y = h - 1; y >= minCheckY; y--) {
                    if (!seenLabel) {
                        if (rowNonBg[y] > 2) { seenLabel = true; labelBottom = y; }
                    } else {
                        if (rowNonBg[y] <= 2) {
                            gapCount++;
                            if (gapCount >= 4) {
                                if ((labelBottom - y) <= h * 0.24) cutY = y + Math.floor(gapCount / 2);
                                break;
                            }
                        } else {
                            gapCount = 0;
                        }
                    }
                }

                if (cutY > 0) {
                    for (let y = cutY; y < h; y++) {
                        const rowOff = y * w * 4;
                        for (let x = 0; x < w; x++) data[rowOff + x * 4 + 3] = 0;
                    }
                }
            }

            const total = w * h;
            const visited = new Uint8Array(total);
            const queue = new Int32Array(total);
            let qHead = 0, qTail = 0;

            const pushIfBg = (x, y) => {
                const idx = y * w + x;
                if (visited[idx]) return;
                if (isWhiteBg(idx * 4)) { visited[idx] = 1; queue[qTail++] = idx; }
            };

            for (let x = 0; x < w; x++) { pushIfBg(x, 0); pushIfBg(x, h - 1); }
            for (let y = 0; y < h; y++) { pushIfBg(0, y); pushIfBg(w - 1, y); }

            while (qHead < qTail) {
                const idx = queue[qHead++];
                data[idx * 4 + 3] = 0;
                const x = idx % w;
                const y = (idx - x) / w;
                if (x > 0) pushIfBg(x - 1, y);
                if (x < w - 1) pushIfBg(x + 1, y);
                if (y > 0) pushIfBg(x, y - 1);
                if (y < h - 1) pushIfBg(x, y + 1);
            }

            for (let y = 1; y < h - 1; y++) {
                for (let x = 1; x < w - 1; x++) {
                    const idx = y * w + x;
                    const p = idx * 4;
                    if (data[p + 3] === 0) continue;
                    const adjTransparent =
                        data[(idx - 1) * 4 + 3] === 0 ||
                        data[(idx + 1) * 4 + 3] === 0 ||
                        data[(idx - w) * 4 + 3] === 0 ||
                        data[(idx + w) * 4 + 3] === 0;
                    if (adjTransparent) {
                        const r = data[p], g = data[p + 1], b = data[p + 2];
                        const max = Math.max(r, g, b), min = Math.min(r, g, b);
                        const avg = (r + g + b) / 3;
                        if (avg > 205 && (max - min) < 25) {
                            data[p + 3] = Math.max(0, Math.round(255 - (avg - 195) * 4.2));
                        }
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);

            let minX = w, minY = h, maxX = -1, maxY = -1;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (data[(y * w + x) * 4 + 3] > 12) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            if (maxX < minX || maxY < minY) return null;

            const cw = maxX - minX + 1;
            const ch = maxY - minY + 1;
            const out = document.createElement('canvas');
            out.width = cw;
            out.height = ch;
            out.getContext('2d').drawImage(srcCanvas, minX, minY, cw, ch, 0, 0, cw, ch);
            return out;
        },

        exportSelfContainedHTML() {
            const payload = { castle: {}, sheets: {} };
            for (let lvl = 1; lvl <= 10; lvl++) {
                payload.castle[lvl] = this.buildingUrls[`castle_${lvl}`] || EMBEDDED_SPRITES.castle[lvl] || "";
            }
            for (const sk in this.sheetRawDataUrls) {
                payload.sheets[sk] = this.sheetRawDataUrls[sk];
            }

            const clone = document.documentElement.cloneNode(true);
            const resetIds = ['hud-resources','context-bar','build-cat-tabs','build-card-list','modal-body'];
            resetIds.forEach(id => {
                const el = clone.querySelector('#' + id);
                if (el) el.innerHTML = '';
            });
            ['context-bar','build-tray','modal-overlay','toast','mission-badge'].forEach(id => {
                const el = clone.querySelector('#' + id);
                if (el) el.style.display = 'none';
            });
            const navBuild = clone.querySelector('#nav-build');
            if (navBuild) navBuild.classList.remove('active');
            const gCanvas = clone.querySelector('#game-canvas');
            if (gCanvas) { gCanvas.removeAttribute('width'); gCanvas.removeAttribute('height'); }

            const startMark = '// === EMBEDDED_' + 'SPRITES_START ===';
            const endMark = '// === EMBEDDED_' + 'SPRITES_END ===';
            const markerRe = new RegExp(startMark + '[\\s\\S]*?' + endMark);
            const replacement = `${startMark}\n    const EMBEDDED_SPRITES = ${JSON.stringify(payload)};\n    ${endMark}`;

            clone.querySelectorAll('script').forEach(sc => {
                if (sc.textContent.includes(startMark)) {
                    sc.textContent = sc.textContent.replace(markerRe, replacement);
                }
            });

            const finalHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
            const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Rabita_with_images.html';
            a.click();
            URL.revokeObjectURL(url);
            UIManager.showToast('🎉 সব ছবিসহ নতুন HTML ডাউনলোড শুরু হয়েছে!', '#2ecc71');
        },

        getBuildingSprite(type, level = 1) {
            if (type === 'castle') {
                const lvl = Math.max(1, Math.min(10, level || 1));
                return this.buildingCanvases[`castle_${lvl}`] || null;
            }
            return this.buildingCanvases[type] || null;
        },

        getBuildingThumbUrl(type, level = 1) {
            if (type === 'castle') {
                const lvl = Math.max(1, Math.min(10, level || 1));
                return this.buildingUrls[`castle_${lvl}`] || null;
            }
            return this.buildingUrls[type] || null;
        }
    };

    // --- 2. PERFORMANCE MANAGER ---
    const PerformanceManager = {
        quality: 'high', fps: 60, frameCount: 0, lastFpsTime: performance.now(), isTabHidden: false,
        init() { document.addEventListener('visibilitychange', () => { this.isTabHidden = document.hidden; }); },
        update(now) {
            this.frameCount++;
            if (now - this.lastFpsTime >= 1000) {
                this.fps = this.frameCount; this.frameCount = 0; this.lastFpsTime = now;
            }
        },
        setQuality(q) {
            this.quality = q;
            UIManager.showToast(`গ্রাফিক্স কোয়ালিটি: ${q.toUpperCase()} করা হয়েছে`, '#2ecc71');
        }
    };

    // --- 3. WORLD & CHUNK MANAGER ---
    const WorldManager = {
        size: CONFIG.MAP_SIZE,
        unlockedRadius: CONFIG.INITIAL_UNLOCK_RADIUS,
        tiles: [], centerX: 24, centerY: 24,

        initNewWorld() {
            this.tiles = [];
            for (let x = 0; x < this.size; x++) {
                this.tiles[x] = [];
                for (let y = 0; y < this.size; y++) {
                    let terrain = 'grass';
                    const riverY = Math.floor(this.centerY + 6 + Math.sin(x * 0.25) * 3);
                    if (y === riverY || y === riverY + 1) terrain = 'water';
                    else {
                        const hash = Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
                        const distCenter = Math.max(Math.abs(x - this.centerX), Math.abs(y - this.centerY));
                        if (distCenter > 3) {
                            if (hash < 0.12) terrain = 'forest';
                            else if (hash > 0.93) terrain = 'hill';
                        }
                    }
                    this.tiles[x][y] = { terrain };
                }
            }
        },

        isInsideBounds(x, y) { return x >= 0 && y >= 0 && x < this.size && y < this.size; },
        isUnlocked(x, y) { return Math.max(Math.abs(x - this.centerX), Math.abs(y - this.centerY)) <= this.unlockedRadius; },
        isNearWater(x, y) {
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const nx = x + dx, ny = y + dy;
                    if (this.isInsideBounds(nx, ny) && this.tiles[nx][ny].terrain === 'water') return true;
                }
            }
            return false;
        },
        getExpandCost() { return Math.floor(250 * Math.pow(1.45, this.unlockedRadius - CONFIG.INITIAL_UNLOCK_RADIUS)); },
        promptExpandLand() {
            if (this.unlockedRadius >= CONFIG.MAX_RADIUS) { UIManager.showToast('সর্বোচ্চ সীমানায় পৌঁছে গেছেন!', '#f39c12'); return; }
            const cost = this.getExpandCost();
            if (ResourceManager.data.gold.amount < cost) { UIManager.showToast(`সীমানা বাড়াতে গোল্ড ${cost} প্রয়োজন!`, '#e74c3c'); return; }
            ResourceManager.data.gold.amount -= cost;
            this.unlockedRadius += 3;
            UIManager.showToast(`রাজ্যের সীমানা প্রসারিত হয়েছে! (+৩ টাইলস)`, '#2ecc71');
            UIManager.updateHUD();
        }
    };

    // --- 4. RESOURCE MANAGER ---
    const ResourceManager = {
        data: {}, baseStorage: 300,
        init() {
            this.data = {};
            for (let k in RESOURCE_META) {
                this.data[k] = { amount: 0, capacity: 300, prod: 0, cons: 0, net: 0, price: RESOURCE_META[k].basePrice };
            }
            this.data.gold.amount = 320; this.data.food.amount = 140; this.data.wood.amount = 90;
            this.data.stone.amount = 50; this.data.water.amount = 60; this.data.iron.amount = 15;
            this.data.bricks.amount = 15; this.data.cloth.amount = 10; this.data.meat.amount = 15;
        },
        canAfford(costObj) {
            for (let res in costObj) if ((this.data[res]?.amount || 0) < costObj[res]) return false;
            return true;
        },
        deduct(costObj) {
            for (let res in costObj) if (this.data[res]) this.data[res].amount = Math.max(0, this.data[res].amount - costObj[res]);
        },
        add(res, val) {
            if (!this.data[res]) return;
            if (RESOURCE_META[res].isCurrency) this.data[res].amount += val;
            else this.data[res].amount = Math.min(this.data[res].capacity, Math.max(0, this.data[res].amount + val));
        }
    };

    // --- 5. POPULATION MANAGER ---
    const PopulationManager = {
        total: 8, capacity: 8, employed: 0, unemployed: 8,
        happiness: 85, health: 80, education: 25, security: 50,
        jobs: {}, growthAccumulator: 0,

        init() {
            this.total = 8; this.capacity = 8; this.jobs = {};
            for (let p in PROFESSIONS) this.jobs[p] = 0;
        },
        tickSimulation(foodShortage, waterShortage) {
            let targetHappy = 70;
            if (foodShortage) targetHappy -= 30;
            if (waterShortage) targetHappy -= 20;
            if (ResourceManager.data.cloth.amount > 5) targetHappy += 5;
            if (ResourceManager.data.meat.amount > 5) targetHappy += 5;
            targetHappy += (this.health - 60) * 0.15 + (EnvironmentManager.quality - 60) * 0.15 + BuildingManager.totalHappyBonus;
            this.happiness = Math.round(Math.max(10, Math.min(100, this.happiness * 0.8 + targetHappy * 0.2)));

            if (foodShortage && this.total > 5) {
                this.growthAccumulator -= 0.35;
                if (this.growthAccumulator <= -1) {
                    this.total--; this.growthAccumulator = 0;
                    UIManager.showToast('⚠️ খাদ্যাভাবে নাগরিক রাজ্য ছেড়ে চলে যাচ্ছে!', '#e74c3c');
                }
            } else if (this.total < this.capacity && this.happiness >= 55 && ResourceManager.data.food.amount > 10) {
                this.growthAccumulator += 0.18 + (this.happiness - 50) * 0.005;
                if (this.growthAccumulator >= 1) {
                    this.total = Math.min(this.capacity, this.total + 1);
                    this.growthAccumulator = 0;
                }
            }
        }
    };

    // --- 6. BUILDING MANAGER ---
    const BuildingManager = {
        map: {}, selectedKey: null, activeBuildTool: null, activeCategory: 'residential', totalHappyBonus: 0,

        init() {
            this.map = {};
            const cx = WorldManager.centerX, cy = WorldManager.centerY;
            this.placeBuildingInstant(cx, cy, 'castle');
            this.placeBuildingInstant(cx, cy + 1, 'road');
            this.placeBuildingInstant(cx, cy + 2, 'road');
            this.placeBuildingInstant(cx + 1, cy + 1, 'cottage');
            this.placeBuildingInstant(cx - 1, cy + 1, 'wheat_farm');
        },
        key(x, y) { return `${x},${y}`; },
        getAt(x, y) { return this.map[this.key(x, y)] || null; },
        placeBuildingInstant(x, y, type) {
            if (!WorldManager.isInsideBounds(x, y)) return;
            WorldManager.tiles[x][y].terrain = (type === 'bridge') ? 'water' : 'grass';
            this.map[this.key(x, y)] = { x, y, type, level: 1, buildProgress: 100, isConstructing: false, active: true, cropStage: 0, efficiency: 1 };
        },
        canPlace(x, y, type) {
            if (!WorldManager.isInsideBounds(x, y)) return { ok: false, msg: 'ম্যাপের বাইরে!' };
            if (!WorldManager.isUnlocked(x, y)) return { ok: false, msg: 'এই জমি এখনো আনলক করা হয়নি! (🗺️ বাটন চাপুন)' };
            if (this.getAt(x, y)) return { ok: false, msg: 'এখানে ইতিমধ্যে একটি স্থাপনা আছে!' };
            const spec = BUILDINGS[type];
            if (!spec) return { ok: false, msg: 'অবৈধ স্থাপনা!' };
            if (spec.era > EconomyManager.currentEra) return { ok: false, msg: `এটি নির্মাণের জন্য যুগ ${spec.era} আনলক করতে হবে!` };

            const tile = WorldManager.tiles[x][y];
            if (spec.onWaterOnly) { if (tile.terrain !== 'water') return { ok: false, msg: 'সেতু শুধুমাত্র নদীর ওপর তৈরি করা যাবে!' }; }
            else { if (tile.terrain === 'water') return { ok: false, msg: 'পানির ওপর এটি তৈরি করা যাবে না!' }; }

            if (spec.nearWater && !WorldManager.isNearWater(x, y)) return { ok: false, msg: `${spec.name} নদীর তীরে স্থাপন করতে হবে!` };
            if (!ResourceManager.canAfford(spec.cost)) return { ok: false, msg: 'পর্যাপ্ত সম্পদ বা গোল্ড নেই!' };
            return { ok: true };
        },
        tryBuild(x, y, type) {
            const check = this.canPlace(x, y, type);
            if (!check.ok) { UIManager.showToast(check.msg, '#e74c3c'); return false; }
            const spec = BUILDINGS[type];
            ResourceManager.deduct(spec.cost);

            const tile = WorldManager.tiles[x][y];
            if (tile.terrain === 'forest') ResourceManager.add('wood', 5);
            if (tile.terrain === 'hill') ResourceManager.add('stone', 5);
            if (!spec.onWaterOnly) tile.terrain = 'grass';

            const fastBuild = ResearchManager.unlocked.has('const_1');
            const instant = spec.buildTime === 0;
            this.map[this.key(x, y)] = {
                x, y, type, level: 1, buildProgress: instant ? 100 : 0, isConstructing: !instant,
                buildSpeed: fastBuild ? 60 : 35, active: true, cropStage: 0, efficiency: 1
            };
            EconomyManager.recalculate();
            UIManager.updateHUD();
            return true;
        },
        tryDemolish(x, y) {
            const b = this.getAt(x, y);
            if (!b) return;
            if (b.type === 'castle') { UIManager.showToast('প্রধান রাজপ্রাসাদ ভাঙা যাবে না!', '#e74c3c'); return; }
            delete this.map[this.key(x, y)];
            if (this.selectedKey === this.key(x, y)) { this.selectedKey = null; UIManager.updateContextBar(); }
            EconomyManager.recalculate();
            UIManager.showToast('স্থাপনাটি ভেঙে ফেলা হয়েছে।', '#f39c12');
        },
        upgradeSelected() {
            if (!this.selectedKey || !this.map[this.selectedKey]) return;
            const b = this.map[this.selectedKey];
            const spec = BUILDINGS[b.type];
            const maxLevel = b.type === 'castle' ? 10 : 5;
            if (spec.isRoad || b.level >= maxLevel) return;

            const baseGold = b.type === 'castle' ? 100 : (spec.cost.gold || 40);
            const baseWood = b.type === 'castle' ? 35 : (spec.cost.wood || 10);
            const upgGold = Math.floor(baseGold * b.level * 0.9);
            const upgWood = Math.floor(baseWood * b.level * 0.7);
            const cost = { gold: upgGold, wood: upgWood };

            if (!ResourceManager.canAfford(cost)) { UIManager.showToast(`আপগ্রেড করতে 🪙${upgGold} ও 🪵${upgWood} প্রয়োজন!`, '#e74c3c'); return; }
            ResourceManager.deduct(cost);
            b.level++;
            EconomyManager.recalculate();
            UIManager.updateContextBar();
            UIManager.showToast(`${spec.name} লেভেল ${b.level}-এ উন্নীত হয়েছে!`, '#2ecc71');
        },
        hasAdjacentRoad(x, y) {
            for (let [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
                const nb = this.getAt(x + dx, y + dy);
                if (nb && (BUILDINGS[nb.type]?.isRoad || nb.type === 'castle')) return true;
            }
            return false;
        },
        countByType(type) {
            let c = 0;
            for (let k in this.map) if (this.map[k].type === type && !this.map[k].isConstructing) c++;
            return c;
        },
        countByCategory(cat) {
            let c = 0;
            for (let k in this.map) if (!this.map[k].isConstructing && BUILDINGS[this.map[k].type]?.cat === cat) c++;
            return c;
        }
    };

    // --- 7. ENVIRONMENT MANAGER ---
    const EnvironmentManager = {
        seasons: [
            { id: 'spring', name: '🌸 বসন্ত', temp: 26, agriMod: 1.15, tint: 'rgba(46, 204, 113, 0.03)' },
            { id: 'summer', name: '☀️ গ্রীষ্ম', temp: 35, agriMod: 1.0,  tint: 'rgba(241, 196, 15, 0.05)' },
            { id: 'autumn', name: '🍂 শরৎ',  temp: 28, agriMod: 1.2,  tint: 'rgba(230, 126, 34, 0.04)' },
            { id: 'winter', name: '❄️ শীত',  temp: 15, agriMod: 0.75, tint: 'rgba(52, 152, 219, 0.07)' }
        ],
        weathers: [
            { id: 'clear',   name: 'পরিষ্কার আকাশ', agriMod: 1.0, waterAdd: 0 },
            { id: 'rain',    name: '🌧️ বৃষ্টিপাত',   agriMod: 1.15, waterAdd: 10 },
            { id: 'storm',   name: '⛈️ ঝড়-বৃষ্টি',   agriMod: 0.85, waterAdd: 15 },
            { id: 'drought', name: '🌵 খরা',        agriMod: 0.65, waterAdd: -6 }
        ],
        seasonIdx: 0, weatherIdx: 0, tickCounter: 0, pollution: 0, quality: 95,
        tick() {
            this.tickCounter++;
            if (this.tickCounter % 25 === 0) this.weatherIdx = Math.floor((this.tickCounter / 25 + this.seasonIdx) % 4);
            if (this.tickCounter % 50 === 0) {
                this.seasonIdx = (this.seasonIdx + 1) % 4;
                UIManager.showToast(`ঋতু পরিবর্তন: এখন ${this.seasons[this.seasonIdx].name}`, '#3498db');
            }
        },
        getCurrentSeason() { return this.seasons[this.seasonIdx]; },
        getCurrentWeather() { return this.weathers[this.weatherIdx]; }
    };

    // --- 8. ECONOMY ENGINE ---
    const EconomyManager = {
        currentEra: 1, workerEfficiency: 1, powerEfficiency: 1,

        recalculate() {
            const res = ResourceManager.data;
            let storageCap = ResourceManager.baseStorage + (ResearchManager.unlocked.has('const_1') ? 200 : 0);
            let popCap = 0, neededWorkers = 0, pollution = 0, envBonus = 0;
            let eduBonus = 20 + (ResearchManager.unlocked.has('edu_1') ? 20 : 0);
            let healthBonus = 60 + (ResearchManager.unlocked.has('med_1') ? 15 : 0);
            let secBonus = 40, happyBonus = 0;

            for (let p in PROFESSIONS) PopulationManager.jobs[p] = 0;
            for (let k in res) { res[k].prod = 0; res[k].cons = 0; }

            for (let key in BuildingManager.map) {
                const b = BuildingManager.map[key];
                const spec = BUILDINGS[b.type];
                if (!spec) continue;
                if (b.isConstructing) { PopulationManager.jobs.builders += 1; neededWorkers += 1; continue; }

                const lvlMult = 1 + (b.level - 1) * 0.35;
                if (spec.popCap) popCap += Math.floor(spec.popCap * lvlMult);
                if (spec.storageBonus) storageCap += Math.floor(spec.storageBonus * lvlMult);
                if (spec.workers) {
                    neededWorkers += spec.workers;
                    if (spec.profession) PopulationManager.jobs[spec.profession] += spec.workers;
                }
                if (spec.pollution) pollution += spec.pollution;
                if (spec.envBonus) envBonus += spec.envBonus;
                if (spec.eduBonus) eduBonus += spec.eduBonus * lvlMult;
                if (spec.healthBonus) healthBonus += spec.healthBonus * lvlMult;
                if (spec.securityBonus) secBonus += spec.securityBonus * lvlMult;
                if (spec.happyBonus) happyBonus += spec.happyBonus;
            }

            PopulationManager.capacity = Math.max(8, popCap);
            PopulationManager.employed = Math.min(PopulationManager.total, neededWorkers);
            PopulationManager.unemployed = Math.max(0, PopulationManager.total - neededWorkers);
            BuildingManager.totalHappyBonus = happyBonus;

            this.workerEfficiency = neededWorkers === 0 ? 1 : Math.min(1, PopulationManager.total / neededWorkers);
            const eduBoost = 1 + Math.min(0.3, (eduBonus - 20) * 0.003);

            for (let k in res) {
                if (!RESOURCE_META[k].isCurrency && !RESOURCE_META[k].isUtility) res[k].capacity = storageCap;
            }

            const energyMult = 1 + (ResearchManager.unlocked.has('energy_1') ? 0.25 : 0);
            for (let key in BuildingManager.map) {
                const b = BuildingManager.map[key];
                if (b.isConstructing) continue;
                const spec = BUILDINGS[b.type];
                const lvlMult = 1 + (b.level - 1) * 0.35;
                if (spec.prod?.electricity) res.electricity.prod += Math.floor(spec.prod.electricity * lvlMult * this.workerEfficiency * energyMult);
                if (spec.cons?.electricity) res.electricity.cons += spec.cons.electricity;
            }
            res.electricity.amount = res.electricity.prod;
            res.electricity.capacity = res.electricity.prod;
            this.powerEfficiency = res.electricity.cons === 0 ? 1 : Math.min(1, res.electricity.prod / res.electricity.cons);

            const season = EnvironmentManager.getCurrentSeason();
            const weather = EnvironmentManager.getCurrentWeather();
            const agriTech = 1 + (ResearchManager.unlocked.has('agri_1') ? 0.2 : 0);
            const indTech = 1 + (ResearchManager.unlocked.has('ind_1') ? 0.25 : 0);
            const commTech = 1 + (ResearchManager.unlocked.has('comm_1') ? 0.3 : 0);

            if (weather.waterAdd > 0) res.water.prod += weather.waterAdd;

            for (let key in BuildingManager.map) {
                const b = BuildingManager.map[key];
                if (b.isConstructing) continue;
                const spec = BUILDINGS[b.type];
                if (!spec) continue;

                const lvlMult = 1 + (b.level - 1) * 0.35;
               let eff = spec.workers > 0 ? Math.min(1.5, this.workerEfficiency * eduBoost) : 1;
                if (spec.roadReq && !BuildingManager.hasAdjacentRoad(b.x, b.y)) eff *= 0.55;
                if (spec.cons?.electricity) eff *= this.powerEfficiency;

                for (let cRes in spec.cons) {
                    if (cRes === 'electricity') continue;
                    res[cRes].cons += spec.cons[cRes];
                    if (res[cRes].amount < spec.cons[cRes]) eff *= 0.25;
                }
                if (spec.maint) res.gold.cons += spec.maint;
                if (spec.cat === 'agriculture') eff *= season.agriMod * weather.agriMod * agriTech;
                if (spec.cat === 'industrial') eff *= indTech;
                if (spec.cat === 'commercial') eff *= commTech;

                b.efficiency = eff;
                for (let pRes in spec.prod) {
                    if (pRes === 'electricity') continue;
                    res[pRes].prod += Math.round(spec.prod[pRes] * lvlMult * eff);
                }
            }

            res.food.cons += Math.max(1, Math.floor(PopulationManager.total * 0.45));
            res.water.cons += Math.max(1, Math.floor(PopulationManager.total * 0.25));
            res.gold.prod += Math.floor(PopulationManager.total * 0.35);

            for (let k in res) res[k].net = res[k].prod - res[k].cons;

            EnvironmentManager.pollution = Math.max(0, pollution - Math.floor(envBonus * 0.6));
            EnvironmentManager.quality = Math.max(10, Math.min(100, 95 - EnvironmentManager.pollution * 2));
            PopulationManager.education = Math.min(100, Math.round(eduBonus));
            PopulationManager.health = Math.min(100, Math.round(healthBonus - EnvironmentManager.pollution));
            PopulationManager.security = Math.min(100, Math.round(secBonus));

            for (let e of ERAS) {
                if (PopulationManager.total >= e.minPop && res.gold.amount >= e.minGold && e.id > this.currentEra) {
                    this.currentEra = e.id;
                    UIManager.showToast(`🎉 অভিনন্দন! আপনার রাজ্য "${e.name}"-এ পদার্পণ করেছে!`, '#8e44ad');
                }
            }
        },

        stepTick() {
            for (let key in BuildingManager.map) {
                const b = BuildingManager.map[key];
                if (b.isConstructing) {
                    b.buildProgress += b.buildSpeed || 35;
                    if (b.buildProgress >= 100) { b.buildProgress = 100; b.isConstructing = false; }
                } else if (BUILDINGS[b.type]?.isCrop) {
                    b.cropStage = (b.cropStage + 1) % 4;
                }
            }

            EnvironmentManager.tick();
            this.recalculate();

            const res = ResourceManager.data;
            let foodShortage = false, waterShortage = false;

            for (let k in res) {
                if (RESOURCE_META[k].isUtility) continue;
                const nextVal = res[k].amount + res[k].net;
                if (k === 'food' && nextVal < 0) foodShortage = true;
                if (k === 'water' && nextVal < 0) waterShortage = true;
                res[k].amount = RESOURCE_META[k].isCurrency ? Math.max(0, nextVal) : Math.min(res[k].capacity, Math.max(0, nextVal));
            }

            if (foodShortage) UIManager.showToast('⚠️ রাজ্যে খাদ্যের ঘাটতি দেখা দিয়েছে! কৃষি খামার তৈরি করুন।', '#e74c3c');
            if (res.electricity.cons > res.electricity.prod) UIManager.showToast('⚠️ বিদ্যুতের লোডশেডিং হচ্ছে! পাওয়ার প্ল্যান্ট তৈরি করুন।', '#e67e22');

            PopulationManager.tickSimulation(foodShortage, waterShortage);
            MarketManager.fluctuatePrices();
            MissionManager.checkAll();
            UIManager.updateHUD();
        }
    };

    // --- 9. MARKET MANAGER ---
    const MarketManager = {
        fluctuatePrices() {
            for (let k in RESOURCE_META) {
                if (RESOURCE_META[k].isCurrency || RESOURCE_META[k].isUtility) continue;
                const r = ResourceManager.data[k];
                const factor = 1.35 - (r.amount / Math.max(1, r.capacity)) * 0.6;
                r.price = Math.max(1, Math.round(RESOURCE_META[k].basePrice * factor * 10) / 10);
            }
        },
        buy(resKey, qty) {
            const r = ResourceManager.data[resKey];
            if (!r) return;
            const totalCost = Math.ceil(r.price * 1.25) * qty;
            if (ResourceManager.data.gold.amount < totalCost) { UIManager.showToast('ক্রয় করার জন্য পর্যাপ্ত গোল্ড নেই!', '#e74c3c'); return; }
            if (r.amount + qty > r.capacity) { UIManager.showToast('গুদামঘরে পর্যাপ্ত জায়গা নেই!', '#e67e22'); return; }
            ResourceManager.data.gold.amount -= totalCost;
            r.amount += qty;
            this.fluctuatePrices(); UIManager.updateHUD(); UIManager.renderModalContent('market');
        },
        sell(resKey, qty) {
            const r = ResourceManager.data[resKey];
            if (!r || r.amount < qty) { UIManager.showToast('বিক্রি করার জন্য পর্যাপ্ত মজুদ নেই!', '#e74c3c'); return; }
            r.amount -= qty;
            ResourceManager.data.gold.amount += Math.max(1, Math.floor(r.price * 0.85)) * qty;
            this.fluctuatePrices(); UIManager.updateHUD(); UIManager.renderModalContent('market');
        }
    };

    // --- 10. RESEARCH & MISSION MANAGERS ---
    const ResearchManager = {
        unlocked: new Set(),
        unlock(techId) {
            const tech = TECH_TREE.find(t => t.id === techId);
            if (!tech || this.unlocked.has(techId)) return;
            if (ResourceManager.data.gold.amount < tech.cost) { UIManager.showToast('গবেষণার জন্য পর্যাপ্ত গোল্ড নেই!', '#e74c3c'); return; }
            ResourceManager.data.gold.amount -= tech.cost;
            this.unlocked.add(techId);
            EconomyManager.recalculate(); UIManager.updateHUD(); UIManager.renderModalContent('research');
            UIManager.showToast(`🔬 গবেষণা সম্পন্ন: ${tech.name}!`, '#2ecc71');
        }
    };

    const MissionManager = {
        completed: new Set(), claimed: new Set(),
        checkAll() {
            let unclaimedCount = 0;
            for (let m of MISSIONS) {
                if (!this.completed.has(m.id) && m.check()) {
                    this.completed.add(m.id);
                    UIManager.showToast(`🏆 মিশন সম্পন্ন: "${m.title}"! পুরস্কার সংগ্রহ করুন।`, '#f1c40f');
                }
                if (this.completed.has(m.id) && !this.claimed.has(m.id)) unclaimedCount++;
            }
            const badge = document.getElementById('mission-badge');
            if (badge) { badge.style.display = unclaimedCount > 0 ? 'inline-block' : 'none'; badge.innerText = unclaimedCount; }
        },
        claim(mId) {
            if (!this.completed.has(mId) || this.claimed.has(mId)) return;
            const m = MISSIONS.find(x => x.id === mId);
            if (!m) return;
            this.claimed.add(mId);
            for (let r in m.reward) ResourceManager.add(r, m.reward[r]);
            this.checkAll(); UIManager.updateHUD(); UIManager.renderModalContent('missions');
            UIManager.showToast('🎁 মিশন পুরস্কার গ্রহণ করা হয়েছে!', '#2ecc71');
        }
    };

    // --- 11. CAMERA & INPUT CONTROLLER ---
    const CameraController = {
        x: 0, y: 0, zoom: 1.0, minZoom: 0.45, maxZoom: 2.0,
        isDragging: false, dragStartX: 0, dragStartY: 0, camStartX: 0, camStartY: 0, dragDistance: 0,
        hoverTile: null, pinchDist: 0,

        init(canvas) {
            this.centerOnCastle();
            canvas.addEventListener('mousedown', (e) => {
                this.isDragging = true; this.dragDistance = 0;
                this.dragStartX = e.clientX; this.dragStartY = e.clientY;
                this.camStartX = this.x; this.camStartY = this.y;
            });
            window.addEventListener('mousemove', (e) => {
                this.hoverTile = this.screenToIso(e.clientX, e.clientY);
                if (!this.isDragging) return;
                const dx = e.clientX - this.dragStartX, dy = e.clientY - this.dragStartY;
                this.dragDistance = Math.hypot(dx, dy);
                this.x = this.camStartX + dx; this.y = this.camStartY + dy;
                this.clamp();
            });
            window.addEventListener('mouseup', (e) => {
                if (this.isDragging && this.dragDistance < 8 && e.target.id === 'game-canvas') this.handleTap(e.clientX, e.clientY);
                this.isDragging = false;
            });
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                this.zoomAt(e.deltaY < 0 ? 0.12 : -0.12, e.clientX, e.clientY);
            }, { passive: false });
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    this.isDragging = true; this.dragDistance = 0;
                    this.dragStartX = e.touches[0].clientX; this.dragStartY = e.touches[0].clientY;
                    this.camStartX = this.x; this.camStartY = this.y;
                } else if (e.touches.length === 2) {
                    this.isDragging = false;
                    this.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                }
            }, { passive: true });
            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && this.isDragging) {
                    const dx = e.touches[0].clientX - this.dragStartX, dy = e.touches[0].clientY - this.dragStartY;
                    this.dragDistance = Math.hypot(dx, dy);
                    this.x = this.camStartX + dx; this.y = this.camStartY + dy;
                    this.clamp();
                } else if (e.touches.length === 2) {
                    const newDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    this.zoomAt((newDist - this.pinchDist) * 0.004, midX, midY);
                    this.pinchDist = newDist;
                }
            }, { passive: true });
            canvas.addEventListener('touchend', (e) => {
                if (this.isDragging && this.dragDistance < 10 && e.changedTouches.length > 0) {
                    this.handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                }
                this.isDragging = false;
            });

            const miniCanvas = document.getElementById('minimap-canvas');
            miniCanvas.addEventListener('pointerdown', (e) => {
                const rect = miniCanvas.getBoundingClientRect();
                const nx = (e.clientX - rect.left) / rect.width, ny = (e.clientY - rect.top) / rect.height;
                this.centerOnTile(Math.floor(nx * CONFIG.MAP_SIZE), Math.floor(ny * CONFIG.MAP_SIZE));
            });
        },
        centerOnTile(tx, ty) {
            const isoX = (tx - ty) * (CONFIG.TILE_W / 2), isoY = (tx + ty) * (CONFIG.TILE_H / 2);
            this.x = window.innerWidth / 2 - isoX * this.zoom;
            this.y = window.innerHeight / 2 - isoY * this.zoom;
            this.clamp();
        },
        centerOnCastle() { this.centerOnTile(WorldManager.centerX, WorldManager.centerY); },
        zoomBy(delta) { this.zoomAt(delta, window.innerWidth / 2, window.innerHeight / 2); },
        zoomAt(delta, screenX, screenY) {
            const oldZoom = this.zoom;
            this.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom + delta));
            const scale = this.zoom / oldZoom;
            this.x = screenX - (screenX - this.x) * scale;
            this.y = screenY - (screenY - this.y) * scale;
            this.clamp();
        },
        clamp() {
            const limit = CONFIG.MAP_SIZE * CONFIG.TILE_W * 0.65 * this.zoom;
            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
            this.x = Math.max(cx - limit, Math.min(cx + limit, this.x));
            this.y = Math.max(cy - limit * 1.1, Math.min(cy + limit * 0.4, this.y));
        },
        screenToIso(sx, sy) {
            const wx = (sx - this.x) / this.zoom, wy = (sy - this.y) / this.zoom;
            const halfW = CONFIG.TILE_W / 2, halfH = CONFIG.TILE_H / 2;
            return { x: Math.floor((wx / halfW + wy / halfH) / 2), y: Math.floor((wy / halfH - wx / halfW) / 2) };
        },
handleTap(sx, sy) {
            let { x, y } = this.screenToIso(sx, sy);
            const tool = BuildingManager.activeBuildTool;

            // বিল্ডিংয়ের ছবির উপর চাপ পড়েছে কি না তা খোঁজার কোড
            const wx = (sx - this.x) / this.zoom;
            const wy = (sy - this.y) / this.zoom;
            let clickedB = null;
            let highestZ = -9999;

            for (let key in BuildingManager.map) {
                const b = BuildingManager.map[key];
                const spec = BUILDINGS[b.type];
                if (!spec || spec.isRoad) continue;

                const px = (b.x - b.y) * (CONFIG.TILE_W / 2);
                const py = (b.x + b.y) * (CONFIG.TILE_H / 2);
                
                let dx, dy, w, h;
                const sprite = SpriteManager.getBuildingSprite(b.type, b.level);
                
                if (sprite) {
                    const scaleMult = 0.9;
                    w = CONFIG.TILE_W * scaleMult;
                    h = w * (sprite.height / sprite.width);
                    dx = px - w / 2;
                    dy = py + (CONFIG.TILE_H * 0.52) - h;
                } else {
                    h = (spec.height || 20) + (b.level - 1) * 4 + 11;
                    w = 44; dx = px - 22; dy = py - h;
                }

                // মাউস বা আঙুল ছবির ভেতরে আছে কি না চেক করা
                if (wx >= dx && wx <= dx + w && wy >= dy + h * 0.1 && wy <= dy + h) {
                    const depth = b.x + b.y;
                    if (depth > highestZ) { highestZ = depth; clickedB = b; }
                }
            }

            // যদি বিল্ডিংয়ের গায়ে চাপ পড়ে, তবে মাটির হিসাব বাদ দিয়ে বিল্ডিংয়ের হিসাব ধরবে
            if (clickedB && (!tool || tool === 'demolish')) {
                x = clickedB.x; y = clickedB.y;
            }

            if (!WorldManager.isInsideBounds(x, y)) return;
            CameraController.hoverTile = { x, y };
            
            if (tool === 'demolish') { BuildingManager.tryDemolish(x, y); return; }
            if (tool) { BuildingManager.tryBuild(x, y, tool); return; }
            
            const b = BuildingManager.getAt(x, y);
            BuildingManager.selectedKey = b ? BuildingManager.key(x, y) : null;
            
            // সিলেক্ট করার পর বিল্ড মেনু লুকিয়ে ফেলা
            if (b) {
                document.getElementById('build-tray').style.display = 'none';
                document.getElementById('nav-build').classList.remove('active');
            }
            
            UIManager.updateContextBar();
        }
    };

    // --- 12. ISOMETRIC CANVAS RENDERER ---
    const MapRenderer = {
        canvas: null, ctx: null, miniCanvas: null, miniCtx: null, animTime: 0, citizensVisual: [],
            visibleBuildings: [],

        init() {
            this.canvas = document.getElementById('game-canvas');
            this.ctx = this.canvas.getContext('2d', { alpha: false });
            this.miniCanvas = document.getElementById('minimap-canvas');
            this.miniCtx = this.miniCanvas.getContext('2d');
            this.resize();
            window.addEventListener('resize', () => this.resize());

            for (let i = 0; i < 18; i++) {
                this.citizensVisual.push({
                    x: WorldManager.centerX, y: WorldManager.centerY + 1,
                    progress: Math.random(), dirX: 1, dirY: 0,
                    color: i % 2 === 0 ? '#f1c40f' : '#3498db'
                });
            }
        },
        resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
        isoToWorld(tx, ty) { return { x: (tx - ty) * (CONFIG.TILE_W / 2), y: (tx + ty) * (CONFIG.TILE_H / 2) }; },

        render(now) {
            if (PerformanceManager.isTabHidden) return;
            this.animTime = now * 0.003;

            const ctx = this.ctx, W = this.canvas.width, H = this.canvas.height;
            ctx.fillStyle = '#0d1722';
            ctx.fillRect(0, 0, W, H);

            ctx.save();
            ctx.translate(CameraController.x, CameraController.y);
            ctx.scale(CameraController.zoom, CameraController.zoom);

            const viewLeft = -CameraController.x / CameraController.zoom - CONFIG.TILE_W;
            const viewRight = (W - CameraController.x) / CameraController.zoom + CONFIG.TILE_W;
            const viewTop = -CameraController.y / CameraController.zoom - CONFIG.TILE_H * 3;
            const viewBottom = (H - CameraController.y) / CameraController.zoom + CONFIG.TILE_H * 2;

            const size = WorldManager.size, chunkSize = CONFIG.CHUNK_SIZE, numChunks = Math.ceil(size / chunkSize);

            for (let cx = 0; cx < numChunks; cx++) {
                for (let cy = 0; cy < numChunks; cy++) {
                    const cCenter = this.isoToWorld(cx * chunkSize + 4, cy * chunkSize + 4);
                    if (cCenter.x < viewLeft - 320 || cCenter.x > viewRight + 320 || cCenter.y < viewTop - 220 || cCenter.y > viewBottom + 220) continue;
                    const endX = Math.min(size, (cx + 1) * chunkSize), endY = Math.min(size, (cy + 1) * chunkSize);
                    for (let x = cx * chunkSize; x < endX; x++) {
                        for (let y = cy * chunkSize; y < endY; y++) {
                            const pos = this.isoToWorld(x, y);
                            if (pos.x < viewLeft || pos.x > viewRight || pos.y < viewTop || pos.y > viewBottom) continue;
                            this.drawTerrainTile(ctx, x, y, pos.x, pos.y);
                        }
                    }
                }
            }

            this.visibleBuildings.length = 0;
            const visibleBuildings = this.visibleBuildings;
            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    const pos = this.isoToWorld(x, y);
                    if (pos.x < viewLeft || pos.x > viewRight || pos.y < viewTop || pos.y > viewBottom) continue;
                    const b = BuildingManager.getAt(x, y), tile = WorldManager.tiles[x][y];
                    if (b || tile.terrain === 'forest' || tile.terrain === 'hill') {
                        visibleBuildings.push({ x, y, px: pos.x, py: pos.y, b, terrain: tile.terrain });
                    }
                }
            }
            visibleBuildings.sort((a, b) => (a.x + a.y) - (b.x + b.y));

            for (let item of visibleBuildings) {
                if (item.b) this.drawBuilding(ctx, item.b, item.px, item.py);
                else if (item.terrain === 'forest') this.drawForest(ctx, item.px, item.py);
                else if (item.terrain === 'hill') this.drawHill(ctx, item.px, item.py);
            }

            if (PerformanceManager.quality !== 'low') this.updateAndDrawCitizens(ctx);

            if (CameraController.hoverTile) {
                const ht = CameraController.hoverTile;
                if (WorldManager.isInsideBounds(ht.x, ht.y)) {
                    const pos = this.isoToWorld(ht.x, ht.y);
                    this.drawSelectionOrPreview(ctx, ht.x, ht.y, pos.x, pos.y);
                }
            }
            if (BuildingManager.selectedKey && BuildingManager.map[BuildingManager.selectedKey]) {
                const sb = BuildingManager.map[BuildingManager.selectedKey];
                const pos = this.isoToWorld(sb.x, sb.y);
                this.drawTileOutline(ctx, pos.x, pos.y, '#f1c40f', 3);
            }
            ctx.restore();

            ctx.fillStyle = EnvironmentManager.getCurrentSeason().tint;
            ctx.fillRect(0, 0, W, H);
            if (PerformanceManager.quality !== 'low') {
                const wId = EnvironmentManager.getCurrentWeather().id;
                if (wId === 'rain' || wId === 'storm') this.drawRainOverlay(ctx, W, H);
            }
            if (PerformanceManager.frameCount % 15 === 0) this.renderMinimap();
        },

        drawTerrainTile(ctx, x, y, px, py) {
            const tile = WorldManager.tiles[x][y], unlocked = WorldManager.isUnlocked(x, y);
            const hw = CONFIG.TILE_W / 2, hh = CONFIG.TILE_H / 2;
            ctx.beginPath();
            ctx.moveTo(px, py - hh); ctx.lineTo(px + hw, py); ctx.lineTo(px, py + hh); ctx.lineTo(px - hw, py);
            ctx.closePath();

            if (!unlocked) { ctx.fillStyle = (x + y) % 2 === 0 ? '#1e2b36' : '#19242e'; ctx.fill(); return; }
            if (tile.terrain === 'water') {
                ctx.fillStyle = Math.sin(this.animTime + (x + y) * 0.5) * 8 > 0 ? '#2980b9' : '#2471a3';
            } else {
                const sId = EnvironmentManager.getCurrentSeason().id;
                if (sId === 'winter') ctx.fillStyle = (x + y) % 2 === 0 ? '#5d8a7a' : '#537e6f';
                else if (sId === 'autumn') ctx.fillStyle = (x + y) % 2 === 0 ? '#58a642' : '#4e9639';
                else ctx.fillStyle = (x + y) % 2 === 0 ? '#44bd32' : '#3eb02d';
            }
            ctx.fill();
            if (PerformanceManager.quality === 'high') { ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.stroke(); }
        },

        drawForest(ctx, px, py) {
            ctx.fillStyle = '#5d4037'; ctx.fillRect(px - 3, py - 10, 6, 10);
            ctx.fillStyle = '#1e8449'; ctx.beginPath(); ctx.arc(px, py - 16, 11, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#27ae60'; ctx.beginPath(); ctx.arc(px - 3, py - 19, 8, 0, Math.PI * 2); ctx.fill();
        },
        drawHill(ctx, px, py) {
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath(); ctx.moveTo(px - 18, py + 4); ctx.lineTo(px - 4, py - 16); ctx.lineTo(px + 16, py + 4); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#95a5a6';
            ctx.beginPath(); ctx.moveTo(px - 4, py - 16); ctx.lineTo(px + 6, py - 8); ctx.lineTo(px + 16, py + 4); ctx.closePath(); ctx.fill();
        },

        drawBuilding(ctx, b, px, py) {
            const spec = BUILDINGS[b.type];
            if (!spec) return;
            if (spec.isRoad) { this.drawRoadTile(ctx, b.x, b.y, px, py, b.type === 'bridge'); return; }

            const sprite = SpriteManager.getBuildingSprite(b.type, b.level);
            if (sprite) {
                const scaleMult = 0.9;
                const drawW = CONFIG.TILE_W * scaleMult;
                const drawH = drawW * (sprite.height / sprite.width);
                const dx = px - drawW / 2;
                const dy = py + (CONFIG.TILE_H * 0.52) - drawH;

                if (b.isConstructing) {
                    ctx.save(); ctx.globalAlpha = 0.4 + (b.buildProgress / 180);
                    ctx.drawImage(sprite, dx, dy, drawW, drawH); ctx.restore();
                    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(px - 16, py - 24, 32, 12);
                    ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(`${Math.floor(b.buildProgress)}%`, px, py - 15);
                } else {
                    ctx.drawImage(sprite, dx, dy, drawW, drawH);
                    if (b.level > 1 && b.type !== 'castle') {
                        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
                        ctx.fillText(`★${b.level}`, px, dy - 2);
                    }
                }
                return;
            }

            if (b.isConstructing) {
                this.drawIsoBox(ctx, px, py, 20, 12, 16, '#d35400', '#a04000');
                ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(`${Math.floor(b.buildProgress)}%`, px, py - 22);
                return;
            }
            if (spec.isCrop) {
                this.drawIsoBox(ctx, px, py, 24, 12, 4, spec.colorTop, spec.colorSide);
                const h = 3 + b.cropStage * 2;
                ctx.fillStyle = b.cropStage >= 2 ? '#f1c40f' : '#2ecc71';
                for (let i = -8; i <= 8; i += 8) ctx.fillRect(px + i - 2, py - h - 2, 4, h);
                return;
            }

            const h = spec.height + (b.level - 1) * 4;
            this.drawIsoBox(ctx, px, py, 22, 11, h, spec.colorTop, spec.colorSide);
            if (b.type === 'castle') {
                this.drawIsoBox(ctx, px, py - h, 12, 6, 16, '#f1c40f', '#b7950b');
                ctx.fillStyle = '#e74c3c'; ctx.fillRect(px - 1, py - h - 26, 2, 10); ctx.fillRect(px + 1, py - h - 26, 8, 5);
            } else if (b.type === 'windmill') {
                ctx.save(); ctx.translate(px, py - h + 6); ctx.rotate(this.animTime);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
                ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.moveTo(0, -14); ctx.lineTo(0, 14); ctx.stroke(); ctx.restore();
            } else if (spec.cat === 'residential') {
                ctx.fillStyle = '#922b21'; ctx.beginPath();
                ctx.moveTo(px - 16, py - h); ctx.lineTo(px, py - h - 12); ctx.lineTo(px + 16, py - h); ctx.closePath(); ctx.fill();
            } else if (spec.pollution && PerformanceManager.quality !== 'low') {
                const smokeY = (this.animTime * 12) % 16;
                ctx.fillStyle = 'rgba(200,200,200,0.45)';
                ctx.beginPath(); ctx.arc(px + 6, py - h - smokeY, 4 + smokeY * 0.15, 0, Math.PI * 2); ctx.fill();
            }
            if (b.level > 1) {
                ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(`★${b.level}`, px, py - h - 14);
            }
        },

        drawRoadTile(ctx, x, y, px, py, isBridge) {
            ctx.fillStyle = isBridge ? '#a04000' : '#7f8c8d';
            ctx.beginPath(); ctx.moveTo(px, py - 9); ctx.lineTo(px + 18, py); ctx.lineTo(px, py + 9); ctx.lineTo(px - 18, py); ctx.closePath(); ctx.fill();
            const dirs = [{ dx: 1, dy: 0, ox: 14, oy: 7 }, { dx: -1, dy: 0, ox: -14, oy: -7 }, { dx: 0, dy: 1, ox: -14, oy: 7 }, { dx: 0, dy: -1, ox: 14, oy: -7 }];
            ctx.strokeStyle = isBridge ? '#d35400' : '#95a5a6'; ctx.lineWidth = 6;
            for (let d of dirs) {
                const nb = BuildingManager.getAt(x + d.dx, y + d.dy);
                if (nb && (BUILDINGS[nb.type]?.isRoad || nb.type === 'castle')) {
                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + d.ox, py + d.oy); ctx.stroke();
                }
            }
        },

        drawIsoBox(ctx, px, py, hw, hh, h, topColor, sideColor) {
            ctx.fillStyle = sideColor;
            ctx.beginPath(); ctx.moveTo(px - hw, py); ctx.lineTo(px, py + hh); ctx.lineTo(px, py + hh - h); ctx.lineTo(px - hw, py - h); ctx.closePath(); ctx.fill();
            ctx.fillStyle = sideColor;
            ctx.beginPath(); ctx.moveTo(px + hw, py); ctx.lineTo(px, py + hh); ctx.lineTo(px, py + hh - h); ctx.lineTo(px + hw, py - h); ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill();
            ctx.fillStyle = topColor;
            ctx.beginPath(); ctx.moveTo(px, py - hh - h); ctx.lineTo(px + hw, py - h); ctx.lineTo(px, py + hh - h); ctx.lineTo(px - hw, py - h); ctx.closePath(); ctx.fill();
        },

        updateAndDrawCitizens(ctx) {
            const activeCount = Math.min(this.citizensVisual.length, Math.ceil(PopulationManager.total / 4));
            for (let i = 0; i < activeCount; i++) {
                const c = this.citizensVisual[i];
                c.progress += 0.02;
                if (c.progress >= 1) {
                    c.progress = 0; c.x += c.dirX; c.y += c.dirY;
                    const valid = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx, dy]) => {
                        const nb = BuildingManager.getAt(c.x + dx, c.y + dy);
                        return nb && BUILDINGS[nb.type]?.isRoad;
                    });
                    if (valid.length > 0) { const p = valid[Math.floor(Math.random() * valid.length)]; c.dirX = p[0]; c.dirY = p[1]; }
                    else { c.x = WorldManager.centerX; c.y = WorldManager.centerY + 1; c.dirX = 0; c.dirY = 0; }
                }
                const pos = this.isoToWorld(c.x + c.dirX * c.progress, c.y + c.dirY * c.progress);
                ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(pos.x, pos.y - 4, 3, 0, Math.PI * 2); ctx.fill();
            }
        },

        drawSelectionOrPreview(ctx, tx, ty, px, py) {
            const tool = BuildingManager.activeBuildTool;
            if (!tool) { this.drawTileOutline(ctx, px, py, 'rgba(255,255,255,0.4)', 1.5); return; }
            if (tool === 'demolish') { this.drawTileOutline(ctx, px, py, '#e74c3c', 2.5); return; }
            this.drawTileOutline(ctx, px, py, BuildingManager.canPlace(tx, ty, tool).ok ? '#2ecc71' : '#e74c3c', 2.5);
        },

        drawTileOutline(ctx, px, py, color, width) {
            const hw = CONFIG.TILE_W / 2, hh = CONFIG.TILE_H / 2;
            ctx.strokeStyle = color; ctx.lineWidth = width;
            ctx.beginPath(); ctx.moveTo(px, py - hh); ctx.lineTo(px + hw, py); ctx.lineTo(px, py + hh); ctx.lineTo(px - hw, py); ctx.closePath(); ctx.stroke();
        },

        drawRainOverlay(ctx, W, H) {
            ctx.strokeStyle = 'rgba(174, 214, 241, 0.35)'; ctx.lineWidth = 1; ctx.beginPath();
            const offset = (this.animTime * 200) % 40;
            for (let x = 0; x < W; x += 45) for (let y = -40; y < H; y += 45) { ctx.moveTo(x, y + offset); ctx.lineTo(x - 6, y + offset + 12); }
            ctx.stroke();
        },

        renderMinimap() {
            const mctx = this.miniCtx, mw = this.miniCanvas.width, mh = this.miniCanvas.height, scale = mw / CONFIG.MAP_SIZE;
            mctx.fillStyle = '#111a24'; mctx.fillRect(0, 0, mw, mh);
            for (let x = 0; x < CONFIG.MAP_SIZE; x++) {
                for (let y = 0; y < CONFIG.MAP_SIZE; y++) {
                    if (!WorldManager.isUnlocked(x, y)) continue;
                    const t = WorldManager.tiles[x][y].terrain, b = BuildingManager.getAt(x, y);
                    if (b) mctx.fillStyle = b.type === 'castle' ? '#f1c40f' : (BUILDINGS[b.type]?.isRoad ? '#95a5a6' : '#e67e22');
                    else if (t === 'water') mctx.fillStyle = '#2980b9';
                    else if (t === 'forest') mctx.fillStyle = '#1e8449';
                    else mctx.fillStyle = '#2ecc71';
                    mctx.fillRect(x * scale, y * scale, Math.ceil(scale), Math.ceil(scale));
                }
            }
            const centerIso = CameraController.screenToIso(window.innerWidth / 2, window.innerHeight / 2);
            mctx.strokeStyle = '#ffffff'; mctx.lineWidth = 1.5;
            mctx.strokeRect(centerIso.x * scale - 6, centerIso.y * scale - 6, 12, 12);
        }
    };

    // --- 13. SAVE & LOAD MANAGER ---
    const SaveManager = {
        dbName: 'MyKingdomIsoDB', storeName: 'saves', db: null,
        init() {
            return new Promise((resolve) => {
                if (!window.indexedDB) { resolve(); return; }
                const req = indexedDB.open(this.dbName, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(this.storeName)) db.createObjectStore(this.storeName);
                };
                req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
                req.onerror = () => resolve();
            });
        },
        serialize() {
            return {
                version: 2, timestamp: Date.now(),
                unlockedRadius: WorldManager.unlockedRadius, tiles: WorldManager.tiles,
                resources: ResourceManager.data,
                population: { total: PopulationManager.total, happiness: PopulationManager.happiness },
                buildings: BuildingManager.map, research: Array.from(ResearchManager.unlocked),
                missionsCompleted: Array.from(MissionManager.completed), missionsClaimed: Array.from(MissionManager.claimed),
                era: EconomyManager.currentEra, quality: PerformanceManager.quality
            };
        },
        deserialize(state) {
            if (!state || !state.buildings) return false;
            WorldManager.unlockedRadius = state.unlockedRadius || CONFIG.INITIAL_UNLOCK_RADIUS;
            if (state.tiles) WorldManager.tiles = state.tiles;
            if (state.resources) for (let k in state.resources) if (ResourceManager.data[k]) ResourceManager.data[k].amount = state.resources[k].amount ?? 0;
            if (state.population) { PopulationManager.total = state.population.total || 8; PopulationManager.happiness = state.population.happiness || 85; }
            BuildingManager.map = state.buildings;
            ResearchManager.unlocked = new Set(state.research || []);
            MissionManager.completed = new Set(state.missionsCompleted || []);
            MissionManager.claimed = new Set(state.missionsClaimed || []);
            EconomyManager.currentEra = state.era || 1;
            if (state.quality) PerformanceManager.quality = state.quality;
            EconomyManager.recalculate(); MissionManager.checkAll(); UIManager.updateHUD();
            return true;
        },
        async saveGame(slot = 'autosave', silent = false) {
            const data = this.serialize();
            try {
                localStorage.setItem(`my_kingdom_${slot}`, JSON.stringify(data));
                if (this.db) {
                    const tx = this.db.transaction(this.storeName, 'readwrite');
                    tx.objectStore(this.storeName).put(data, slot);
                }
                if (!silent) UIManager.showToast('💾 গেম সফলভাবে সেভ করা হয়েছে!', '#2ecc71');
            } catch (err) { if (!silent) UIManager.showToast('সেভ করতে সমস্যা হয়েছে!', '#e74c3c'); }
        },
        async loadGame(slot = 'autosave') {
            return new Promise((resolve) => {
                if (this.db) {
                    const tx = this.db.transaction(this.storeName, 'readonly');
                    const req = tx.objectStore(this.storeName).get(slot);
                    req.onsuccess = () => { if (req.result && this.deserialize(req.result)) resolve(true); else this.loadFallback(slot, resolve); };
                    req.onerror = () => this.loadFallback(slot, resolve);
                } else this.loadFallback(slot, resolve);
            });
        },
        loadFallback(slot, resolve) {
            try {
                const raw = localStorage.getItem(`my_kingdom_${slot}`);
                if (raw && this.deserialize(JSON.parse(raw))) { resolve(true); return; }
            } catch (e) {}
            resolve(false);
        },
        exportJSON() {
            const blob = new Blob([JSON.stringify(this.serialize())], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `amar_rajjo_save_${Date.now()}.json`; a.click();
            URL.revokeObjectURL(url);
        },
        importJSON(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    if (this.deserialize(JSON.parse(e.target.result))) {
                        this.saveGame('autosave', true); UIManager.closeModal();
                        UIManager.showToast('📂 সেভ ফাইল সফলভাবে লোড হয়েছে!', '#2ecc71');
                    }
                } catch (err) { UIManager.showToast('অকার্যকর সেভ ফাইল!', '#e74c3c'); }
            };
            reader.readAsText(file);
        },
        resetGame() {
            if (!confirm('আপনি কি নিশ্চিতভাবে সম্পূর্ণ রাজ্য রিসেট করে নতুন করে শুরু করতে চান?')) return;
            localStorage.removeItem('my_kingdom_autosave');
            if (this.db) this.db.transaction(this.storeName, 'readwrite').objectStore(this.storeName).delete('autosave');
            location.reload();
        }
    };

    // --- 14. UI MANAGER ---
    const UIManager = {
        activeModal: null, toastTimer: null,
        init() { this.renderBuildCategories(); this.renderBuildCards(); this.updateHUD(); },

        getResIconHTML(resKey, size = 18) {
            const url = SpriteManager.resourceUrls[resKey];
            if (url) return `<img src="${url}" alt="${resKey}" style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle;">`;
            return RESOURCE_META[resKey]?.icon || '';
        },

        updateHUD() {
            const hudRes = document.getElementById('hud-resources');
            const displayOrder = ['gold', 'food', 'wood', 'stone', 'iron', 'electricity', 'water', 'bricks', 'cloth', 'meat'];
            let html = '';

            for (let k of displayOrder) {
                const r = ResourceManager.data[k];
                let valStr = Math.floor(r.amount);
                let rateStr = (r.net >= 0 ? '+' : '') + r.net + '/s';
                let rateClass = r.net < 0 ? 'neg' : (r.net > 0 ? 'pos' : '');
                if (k === 'electricity') {
                    valStr = `${r.cons}/${r.prod}`;
                    rateStr = r.cons > r.prod ? 'ঘাটতি!' : 'স্বাভাবিক';
                    rateClass = r.cons > r.prod ? 'neg' : 'pos';
                }
                html += `
                    <div class="res-pill" onclick="UIManager.openModal('economy')">
                        <span class="icon">${this.getResIconHTML(k, 22)}</span>
                        <div class="res-info"><span class="res-val">${valStr}</span><span class="res-rate ${rateClass}">${rateStr}</span></div>
                    </div>
                `;
            }
            html += `
                <div class="res-pill" onclick="UIManager.openModal('citizens')">
                    <span class="icon">👨‍👩‍👧‍👦</span>
                    <div class="res-info"><span class="res-val">${PopulationManager.employed}/${PopulationManager.total}</span><span class="res-rate">ধারণ: ${PopulationManager.capacity}</span></div>
                </div>
            `;
            hudRes.innerHTML = html;

            document.getElementById('hud-era').innerText = (ERAS.find(e => e.id === EconomyManager.currentEra) || ERAS[0]).name;
            const season = EnvironmentManager.getCurrentSeason(), weather = EnvironmentManager.getCurrentWeather();
            document.getElementById('hud-season').innerText = `${season.name} • ${season.temp}°C (${weather.name})`;
            document.getElementById('hud-env').innerText = `🌿 পরিবেশ: ${EnvironmentManager.quality}%`;
            document.getElementById('hud-happy').innerText = `😊 সুখ: ${PopulationManager.happiness}%`;
        },

        toggleBuildTray() {
            const tray = document.getElementById('build-tray'), btn = document.getElementById('nav-build');
            if (tray.style.display === 'flex') {
                tray.style.display = 'none'; btn.classList.remove('active');
                BuildingManager.activeBuildTool = null; this.updateContextBar();
            } else {
                tray.style.display = 'flex'; btn.classList.add('active');
                this.renderBuildCategories(); this.renderBuildCards();
            }
        },

        selectCategory(catId) {
            if (catId === 'demolish') {
                BuildingManager.activeBuildTool = BuildingManager.activeBuildTool === 'demolish' ? null : 'demolish';
                this.renderBuildCategories(); this.renderBuildCards(); this.updateContextBar(); return;
            }
            BuildingManager.activeCategory = catId;
            if (BuildingManager.activeBuildTool === 'demolish') BuildingManager.activeBuildTool = null;
            this.renderBuildCategories(); this.renderBuildCards(); this.updateContextBar();
        },

        selectBuildTool(type) {
            BuildingManager.activeBuildTool = BuildingManager.activeBuildTool === type ? null : type;
            if (BuildingManager.activeBuildTool) BuildingManager.selectedKey = null;
            this.renderBuildCards(); this.updateContextBar();
        },

        renderBuildCategories() {
            let html = '';
            for (let c of BUILD_CATEGORIES) {
                const isActive = (c.id === 'demolish' && BuildingManager.activeBuildTool === 'demolish') ||
                                 (c.id !== 'demolish' && BuildingManager.activeCategory === c.id && BuildingManager.activeBuildTool !== 'demolish');
                html += `<button class="cat-tab ${isActive ? 'active' : ''}" onclick="UIManager.selectCategory('${c.id}')">${c.name}</button>`;
            }
            document.getElementById('build-cat-tabs').innerHTML = html;
        },

        renderBuildCards() {
            const container = document.getElementById('build-card-list');
            if (BuildingManager.activeBuildTool === 'demolish') {
                container.innerHTML = `<div style="padding:8px; color:#f1c40f; font-size:12px;">🚜 ম্যাপের যেকোনো ইমারতের ওপর ট্যাপ করে সেটি ভেঙে ফেলুন।</div>`;
                return;
            }
            let html = '';
            for (let key in BUILDINGS) {
                if (key === 'castle') continue;
                const b = BUILDINGS[key];
                if (b.cat !== BuildingManager.activeCategory) continue;

                const locked = b.era > EconomyManager.currentEra, active = BuildingManager.activeBuildTool === key;
                const costParts = Object.entries(b.cost).map(([r, v]) => `<span>${this.getResIconHTML(r, 11)}${v}</span>`);

                let subText = '';
                if (b.popCap) subText = `👨‍👩‍👧‍👦 +${b.popCap} আবাসন`;
                else if (b.storageBonus) subText = `📦 +${b.storageBonus} গুদাম`;
                else if (b.eduBonus) subText = `🎓 +${b.eduBonus} শিক্ষা`;
                else if (b.healthBonus) subText = `🏥 +${b.healthBonus} স্বাস্থ্য`;
                else if (b.securityBonus) subText = `🛡️ +${b.securityBonus} প্রতিরক্ষা`;
                else if (b.envBonus) subText = `🌿 +${b.envBonus} পরিবেশ`;
                else {
                    const pKeys = Object.keys(b.prod || {});
                    if (pKeys.length > 0) subText = `${this.getResIconHTML(pKeys[0], 11)} +${b.prod[pKeys[0]]}/s`;
                    else if (b.isRoad) subText = 'যোগাযোগ পথ';
                }

                const thumbUrl = SpriteManager.getBuildingThumbUrl(key);
                const thumbHTML = thumbUrl
                    ? `<div class="b-card-thumb"><img src="${thumbUrl}" alt="${b.name}"></div>`
                    : `<div class="b-card-thumb"><div style="width:28px;height:18px;border-radius:4px;background:${b.colorTop};border:2px solid ${b.colorSide};"></div></div>`;

                html += `
                    <div class="b-card ${active ? 'active' : ''} ${locked ? 'locked' : ''}" onclick="UIManager.selectBuildTool('${key}')">
                        ${thumbHTML}
                        <div class="b-card-title">${b.name}</div>
                        <div class="b-card-cost">${costParts.join('')}</div>
                        <div class="b-card-sub">${locked ? '🔒 যুগ ' + b.era : subText}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
        },

        updateContextBar() {
            const bar = document.getElementById('context-bar'), tool = BuildingManager.activeBuildTool;
            if (tool === 'demolish') {
                bar.style.display = 'flex';
                bar.innerHTML = `<span>🚜 <b>বুলডোজার মোড চালু:</b> ভাঙার জন্য যেকোনো স্থাপনায় ট্যাপ করুন</span><button class="ctx-btn" onclick="UIManager.selectBuildTool(null)">বাতিল</button>`;
                return;
            }
            if (tool && BUILDINGS[tool]) {
                bar.style.display = 'flex';
                bar.innerHTML = `<span>🏗️ <b>${BUILDINGS[tool].name}</b>: ${BUILDINGS[tool].desc}</span><button class="ctx-btn" onclick="UIManager.selectBuildTool(null)">বাতিল</button>`;
                return;
            }
            if (BuildingManager.selectedKey && BuildingManager.map[BuildingManager.selectedKey]) {
                const b = BuildingManager.map[BuildingManager.selectedKey], spec = BUILDINGS[b.type];
                const maxLevel = b.type === 'castle' ? 10 : 5;

                    ${(!spec.isRoad && b.level < maxLevel) ? `<button class="ctx-btn primary" onclick="BuildingManager.upgradeSelected()">⬆️ আপগ্রেড (🪙${upgGold} 🪵${upgWood})</button>` : ''}
                    <button class="ctx-btn" onclick="UIManager.openModal('building_info')">ℹ️ বিস্তারিত</button>

                        <div>
                            <h4>এক ক্লিকে সব ছবিসহ HTML তৈরি করুন</h4>
